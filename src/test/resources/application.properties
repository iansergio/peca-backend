# Configuracao usada apenas nos testes: banco H2 em memoria (modo PostgreSQL),
# para que o build nao dependa de um PostgreSQL rodando.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
# O schema dos testes vem do Hibernate (create-drop), nao das migrations.
spring.flyway.enabled=false
jwt.secret=segredo-de-teste-com-pelo-menos-32-caracteres
spring.mail.host=localhost
app.mail.remetente=nao-responda@peca.test
# Igual ao main: os testes usam X-Forwarded-For para simular IPs diferentes.
server.forward-headers-strategy=framework
app.cors.origens-permitidas=http://localhost:5173,https://peca.example
# Igual ao main (o application.properties de teste substitui o do main).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false
app.armazenamento.diretorio=${java.io.tmpdir}/peca-imagens-teste
app.armazenamento.url-publica=http://localhost:8080/api/imagens
