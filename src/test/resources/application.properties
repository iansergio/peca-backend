# Configuracao usada apenas nos testes: banco H2 em memoria (modo PostgreSQL),
# para que o build nao dependa do Supabase.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# O schema vem das mesmas migrations do main e o Hibernate so valida, como em producao.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
jwt.secret=segredo-de-teste-com-pelo-menos-32-caracteres
spring.mail.host=localhost
app.mail.remetente=nao-responda@peca.test
# Igual ao main: os testes usam X-Forwarded-For para simular IPs diferentes.
server.forward-headers-strategy=framework
app.cors.origens-permitidas=http://localhost:5173,https://peca.example
# Igual ao main (o application.properties de teste substitui o do main).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false
