# Configuracao usada apenas nos testes: banco H2 em memoria (modo SQL Server),
# para que o build nao dependa de um Azure SQL real.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
# O schema dos testes vem do Hibernate (create-drop); as migrations T-SQL nao rodam no H2.
spring.flyway.enabled=false
jwt.secret=segredo-de-teste-com-pelo-menos-32-caracteres
spring.mail.host=localhost
app.mail.remetente=nao-responda@peca.test
# Igual ao main: os testes usam X-Forwarded-For para simular IPs diferentes.
server.forward-headers-strategy=framework
