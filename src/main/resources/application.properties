spring.application.name=peca-backend

# Carrega variaveis de um arquivo .env na raiz do projeto, se existir.
# Variaveis de ambiente reais do sistema continuam tendo prioridade.
spring.config.import=optional:file:.env[.properties]

# Conexao com o PostgreSQL (Supabase).
# As credenciais vem exclusivamente de variaveis de ambiente (ver .env.example).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Swagger / OpenAPI (springdoc)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Supabase Storage (upload de imagens das pecas).
# O bucket deve ser publico. A service key e secreta: nunca exponha no front-end.
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket=${SUPABASE_STORAGE_BUCKET:pecas}

# Limite de upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
