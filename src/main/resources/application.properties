spring.application.name=peca-backend

# Porta HTTP. Azure Container Apps/App Service podem definir PORT.
server.port=${PORT:8080}

# Carrega variaveis de um arquivo .env na raiz do projeto, se existir.
# Variaveis de ambiente reais do sistema continuam tendo prioridade.
spring.config.import=optional:file:.env[.properties]

# Conexao com o PostgreSQL do Supabase (pooler em modo sessao, porta 5432).
# As credenciais vem exclusivamente de variaveis de ambiente (ver .env.example).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Migrations versionadas (Flyway). O schema e criado pelas migrations, nao pelo Hibernate.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Swagger / OpenAPI (springdoc)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Supabase Storage (upload de imagens das pecas).
# O bucket deve ser publico. A service key e secreta: nunca exponha no front-end.
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket=${SUPABASE_STORAGE_BUCKET:pecas}

# Limite de upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Autenticacao JWT (HS256). O segredo deve ter pelo menos 32 caracteres.
# Gere um com: openssl rand -base64 48
jwt.secret=${JWT_SECRET:}
jwt.expiracao=${JWT_EXPIRACAO:PT2H}

# Envio de email (codigo OTP) via SMTP. Credenciais vem de variaveis de ambiente.
# No Gmail, MAIL_PASSWORD deve ser uma "senha de app", nao a senha da conta.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Remetente exibido no email (padrao: o proprio MAIL_USERNAME).
app.mail.remetente=${MAIL_FROM:${MAIL_USERNAME:}}

# Limites de solicitacao do codigo OTP (POST /api/auth/solicitar-codigo). Excedido: HTTP 429 + Retry-After.
app.otp.intervalo-entre-pedidos=60s
app.otp.max-pedidos-por-hora-email=5
app.otp.max-pedidos-por-hora-ip=20

# Usa X-Forwarded-For/Forwarded para obter o IP real do cliente (limite por IP do OTP).
# ATENCAO: esses headers so sao confiaveis atras de um proxy confiavel (ex: ingress do Azure) que os
# sobrescreva; exposta diretamente, qualquer cliente pode forjar o IP e escapar do limite por IP.
server.forward-headers-strategy=framework

# CORS: origens do front-end separadas por virgula (ex: https://peca.app,http://localhost:5173).
# Nunca use '*'. Vazio = nenhuma origem liberada.
app.cors.origens-permitidas=${CORS_ALLOWED_ORIGINS:}

# Actuator: expoe somente o health (liveness/readiness para o container), sem detalhes.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Readiness inclui o banco: com o PostgreSQL inacessivel a aplicacao fica unhealthy.
management.endpoint.health.group.readiness.include=readinessState,db
# Uma falha do SMTP nao deve derrubar o health do container.
management.health.mail.enabled=false
