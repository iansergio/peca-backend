spring.application.name=peca-backend

# Carrega variaveis de um arquivo .env na raiz do projeto, se existir.
# Variaveis de ambiente reais do sistema continuam tendo prioridade.
spring.config.import=optional:file:.env[.properties]

# Conexao com o Azure SQL Database.
# As credenciais vem exclusivamente de variaveis de ambiente (ver .env.example).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# O Azure SQL serverless pode estar pausado e demorar para acordar na primeira conexao.
spring.datasource.hikari.connection-timeout=60000

# Migrations versionadas (Flyway). O schema e criado pelas migrations, nao pelo Hibernate.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# Mapeia String para nvarchar (Unicode) no SQL Server, igual as migrations.
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# Swagger / OpenAPI (springdoc)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Supabase Storage (upload de imagens das pecas).
# O bucket deve ser publico. A service key e secreta: nunca exponha no front-end.
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket=${SUPABASE_STORAGE_BUCKET:pecas}

# Limite de upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Autenticacao JWT (HS256). O segredo deve ter pelo menos 32 caracteres.
# Gere um com: openssl rand -base64 48
jwt.secret=${JWT_SECRET:}
jwt.expiracao=${JWT_EXPIRACAO:PT2H}

# Envio de email (codigo OTP) via SMTP. Credenciais vem de variaveis de ambiente.
# No Gmail, MAIL_PASSWORD deve ser uma "senha de app", nao a senha da conta.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Remetente exibido no email (padrao: o proprio MAIL_USERNAME).
app.mail.remetente=${MAIL_FROM:${MAIL_USERNAME:}}
