spring.application.name=peca-backend

# Carrega variaveis de um arquivo .env na raiz do projeto, se existir.
# Variaveis de ambiente reais do sistema continuam tendo prioridade.
spring.config.import=optional:file:.env[.properties]

# Conexao com o PostgreSQL (Supabase).
# As credenciais vem exclusivamente de variaveis de ambiente (ver .env.example).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Swagger / OpenAPI (springdoc)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
