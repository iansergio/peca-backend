# Desenvolvimento local. Le as variaveis do .env (veja .env.example e o README).
#   API contra o Azure SQL:       docker compose up --build
#   API com SQL Server local:     docker compose --profile banco-local up --build

services:
  api:
    build: .
    image: peca-backend:local
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:$${PORT:-8080}/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    depends_on:
      # So vale com o perfil banco-local; sem ele a dependencia e ignorada.
      sqlserver-init:
        condition: service_completed_successfully
        required: false

  # Opcional: SQL Server local para rodar sem o Azure. A senha vem de MSSQL_SA_PASSWORD no .env.
  sqlserver-local:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["banco-local"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-dados:/var/opt/mssql
    healthcheck:
      # -C confia no certificado autoassinado do container (apenas uso local).
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  # Cria o banco "peca" na primeira vez (idempotente) e termina. As tabelas sao criadas pelo Flyway.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["banco-local"]
    depends_on:
      sqlserver-local:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    entrypoint: ["/bin/sh", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S sqlserver-local -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q \"IF DB_ID('peca') IS NULL CREATE DATABASE peca\""]
    restart: "no"

volumes:
  sqlserver-dados:
