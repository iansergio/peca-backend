# Desenvolvimento local. Le as variaveis do .env (veja .env.example e o README).
#   API contra o PostgreSQL do Supabase:  docker compose up --build
#   API com PostgreSQL local:             docker compose --profile banco-local up --build

services:
  api:
    build: .
    image: peca-backend:local
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:$${PORT:-8080}/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    depends_on:
      # So vale com o perfil banco-local; sem ele a dependencia e ignorada.
      postgres-local:
        condition: service_healthy
        required: false

  # Opcional: PostgreSQL local para rodar sem o Supabase. O banco "peca" e criado na primeira subida;
  # as tabelas sao criadas pelo Flyway. A senha vem de POSTGRES_PASSWORD no .env.
  postgres-local:
    image: postgres:17-alpine
    profiles: ["banco-local"]
    environment:
      POSTGRES_DB: peca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peca"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

volumes:
  postgres-dados:
