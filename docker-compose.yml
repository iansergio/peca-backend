# Ambiente completo numa maquina so: banco, email, API e front-end.
# O front-end e construido a partir do repositorio irmao (padrao: ../peca-front-end; mude com FRONTEND_DIR).
#   docker compose up --build
#     Front-end: http://localhost:3000
#     API/Swagger: http://localhost:8080/swagger-ui.html
#     Emails (codigos OTP): http://localhost:8025, enquanto o SMTP real nao estiver configurado no .env
# As variaveis tem padroes para desenvolvimento; um .env (veja .env.example) pode sobrescreve-las.

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: peca
      POSTGRES_USER: ${DB_USERNAME:-peca}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-peca}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d peca"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Servidor SMTP local: prende todos os emails e mostra numa caixa de entrada web.
  # So e usado quando o .env nao define MAIL_HOST (sem SMTP real, ex: Gmail).
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  api:
    build: .
    image: peca-backend:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/peca
      DB_USERNAME: ${DB_USERNAME:-peca}
      DB_PASSWORD: ${DB_PASSWORD:-peca}
      JWT_SECRET: ${JWT_SECRET:-segredo-de-desenvolvimento-local-troque-se-for-expor}
      # SMTP real (ex: Gmail) se o .env definir MAIL_*; senao, o Mailpit.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME:-PECA <nao-responda@peca.local>}}
      STORAGE_DIR: /dados/imagens
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - imagens:/dados/imagens
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  web:
    build: ${FRONTEND_DIR:-../peca-front-end}
    image: peca-front-end:local
    environment:
      API_URL: http://api:8080/api
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-dados:
  imagens:
