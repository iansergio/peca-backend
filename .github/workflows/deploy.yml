# Testes em todo PR para a main; em push na main, publica a imagem no GHCR e atualiza o Azure Container Apps.
name: Testes e deploy no Azure Container Apps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGEM: ghcr.io/iansergio/peca-backend
  GRUPO_RECURSOS: rg-peca-app
  CONTAINER_APP: peca-api

jobs:
  testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build e testes
        run: ./mvnw -B clean package

  deploy:
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Um deploy por vez; um push novo espera o anterior terminar.
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write # login no Azure por OIDC, sem senha guardada no GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Atualiza o Container App
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update -g "$GRUPO_RECURSOS" -n "$CONTAINER_APP" --image "$IMAGEM:${{ github.sha }}"
